name: Deploy to Hugging Face

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Git LFS
        run: |
          git lfs install

      - name: Push to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "ics.anand.poc@gmail.com"
          git config --global user.name "ics-anand-poc"
          git remote add hf https://ANANDS983:$HF_TOKEN@huggingface.co/spaces/ANANDS983/AI-Interview
          git push --force hf HEAD:main